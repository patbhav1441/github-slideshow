name: Firehouse Catering Lead Scan

on:
  push:
    branches:
      - firehouse-catering-research-20260818
    paths:
      - "firehouse_research/**"
      - ".github/workflows/firehouse-catering-research.yml"
  pull_request:
    branches:
      - main
    paths:
      - "firehouse_research/**"
      - ".github/workflows/firehouse-catering-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "overturemaps==1.0.1" "requests>=2.32" "rapidfuzz>=3.9"

      - name: Build and validate 500 physical-address leads
        run: |
          python - <<'PY'
          import firehouse_research.build_leads as research

          verified_centers = {
              "Woodstock": (34.0869120, -84.5286110, "9745 Highway 92 shopping center, Woodstock, GA 30188"),
              "Tucker": (33.8554913, -84.2098366, "4306 Lawrenceville Highway shopping center, Tucker, GA 30084"),
          }

          def use_verified_center(address: str):
              store_name = "Woodstock" if "Woodstock" in address else "Tucker"
              return verified_centers[store_name]

          # Overture Places is the authoritative bulk source here. The raw
          # Overpass query can time out on dense Atlanta-area results; public
          # websites are still checked on the strongest candidate pool.
          research.geocode = use_verified_center
          research.fetch_overpass = lambda store: []
          research.main()
          PY

      - name: Show validation summary
        if: always()
        run: |
          find output -maxdepth 1 -type f -printf "%f %s bytes\n" 2>/dev/null || true
          cat output/summary.json 2>/dev/null || true

      - name: Upload validated research package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firehouse-verified-leads
          path: |
            output/verified_leads.csv
            output/woodstock_leads.csv
            output/tucker_leads.csv
            output/top_100.csv
            output/summary.json
          if-no-files-found: error
          retention-days: 7
